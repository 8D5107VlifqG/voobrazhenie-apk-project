<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр воображения</title>
<style>
@font-face { font-family: "Golos Text"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(fonts/golos-text-cyrillic-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Golos Text"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(fonts/golos-text-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Literata"; font-style: normal; font-weight: 200 900; font-display: swap; src: url(fonts/literata-cyrillic-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Literata"; font-style: normal; font-weight: 200 900; font-display: swap; src: url(fonts/literata-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --bg: #f1e9df;
  --surface: #fbf4ea;
  --ink: #2b1d14;
  --muted: #7a6757;
  --line: #dccdbd;
  --accent: #8a5a33;
  --accent-ink: #ffffff;
  --param-bg: #ead9c5;
  --param-ink: #5b3a1e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1611;
    --surface: #2b1f18;
    --ink: #ede2d3;
    --muted: #a8968a;
    --line: #43322a;
    --accent: #c08a55;
    --accent-ink: #1f1611;
    --param-bg: #3a2a20;
    --param-ink: #e6c9a6;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1611;
  --surface: #2b1f18;
  --ink: #ede2d3;
  --muted: #a8968a;
  --line: #43322a;
  --accent: #c08a55;
  --accent-ink: #1f1611;
  --param-bg: #3a2a20;
  --param-ink: #e6c9a6;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 20px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 8px;
  color: var(--muted);
  font-size: 14px;
}
.top button {
  background: none;
  border: 1px solid var(--line);
  color: var(--muted);
  font: inherit;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
}
.progress {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 28px;
  padding: 12px 0 120px;
  min-height: 0;
  overflow-y: auto;
}
.lead { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.4; }
.question {
  margin: 0;
  font-family: "Literata", Georgia, "Times New Roman", serif;
  font-weight: 500;
  font-size: clamp(30px, 8vw, 52px);
  line-height: 1.18;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.param {
  align-self: flex-start;
  display: flex;
  align-items: baseline;
  gap: 12px;
  background: var(--param-bg);
  color: var(--param-ink);
  border-radius: 14px;
  padding: 14px 20px;
  font-size: clamp(22px, 5.5vw, 30px);
  font-weight: 600;
}
.param small { font-size: 15px; font-weight: 500; opacity: .75; }
.category { margin: 0; color: var(--muted); font-size: 17px; }
.category b { color: var(--ink); font-weight: 600; }

.next {
  position: fixed;
  right: max(20px, calc(50% - 360px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  min-width: 150px;
  height: 64px;
  padding: 0 32px;
  border: 0;
  border-radius: 20px;
  background: var(--accent);
  color: var(--accent-ink);
  font: inherit;
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,.22);
}
.next:active { transform: scale(.97); }
.back {
  position: fixed;
  left: max(20px, calc(50% - 360px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  height: 64px;
  padding: 0 22px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 16px;
  cursor: pointer;
}
button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }

/* panels */
.sheet {
  position: fixed; inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
  z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
}
.sheet.open { display: flex; }
.sheet-inner { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 20px 40px; overflow-y: auto; flex: 1; }
.sheet h2 { font-family: "Literata", Georgia, serif; font-weight: 500; font-size: 26px; margin: 18px 0 14px; }
.sheet .bar { display: flex; justify-content: flex-end; padding: 14px 20px 0; max-width: 760px; width: 100%; margin: 0 auto; }
.bar button, .btn {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px;
  font: inherit; font-size: 16px; padding: 12px 18px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 18px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li button {
  width: 100%; text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  font: inherit; font-size: 17px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer;
}
.list li button span { color: var(--muted); font-size: 14px; white-space: nowrap; }
.list li button.cur { border-color: var(--accent); }
.note { color: var(--muted); font-size: 14px; line-height: 1.5; }
.status { margin: 8px 0; font-size: 15px; color: var(--accent); }
.finish { text-align: left; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span id="counter"></span>
    <div style="display:flex;gap:8px">
      <button id="btnMenu" type="button">Категории</button>
      <button id="btnSettings" type="button">Настройки</button>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <main id="stage" aria-live="polite"></main>
</div>

<button class="back" id="btnBack" type="button">Назад</button>
<button class="next" id="btnNext" type="button">Далее</button>

<!-- Категории -->
<div class="sheet" id="menuSheet" role="dialog" aria-label="Категории">
  <div class="bar"><button type="button" data-close>Закрыть</button></div>
  <div class="sheet-inner">
    <h2>Категории</h2>
    <ul class="list" id="catList"></ul>
  </div>
</div>

<!-- Настройки -->
<div class="sheet" id="setSheet" role="dialog" aria-label="Настройки">
  <div class="bar"><button type="button" data-close>Закрыть</button></div>
  <div class="sheet-inner">
    <h2>Загрузить списки</h2>
    <p class="note">Выберите все .txt файлы разом, включая ДИСК.txt. Номер в начале названия задаёт порядок, остальное название становится категорией. Первая строка каждого файла — вводная фраза («Вспомните момент, когда:»).</p>
    <div class="row">
      <button class="btn primary" id="btnPick" type="button">Выбрать файлы</button>
      <button class="btn" id="btnPickDir" type="button">Выбрать папку (компьютер)</button>
    </div>
    <input type="file" id="filePick" accept=".txt,text/plain" multiple hidden>
    <input type="file" id="dirPick" webkitdirectory multiple hidden>
    <div class="status" id="loadStatus"></div>

    <h2>Прогресс</h2>
    <div class="row">
      <button class="btn" id="btnRestart" type="button">Начать с первого вопроса</button>
      <button class="btn" id="btnBuiltin" type="button">Вернуть встроенные списки</button>
      <button class="btn" id="btnTheme" type="button">Тема: авто</button>
    </div>
    <p class="note" id="info"></p>
  </div>
</div>

/* ---------- состояние ---------- */
var KEY = "imaginetrainer.v1";
var state = { lists: DEFAULT_LISTS, disk: DEFAULT_DISK, pos: 0, theme: "dark", src: "builtin" };
var flat = [];   // плоский список вопросов

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.lists && s.lists.length && s.disk && s.disk.length) {
        if (s.src === "custom") state = s;
        else { state.pos = s.pos || 0; state.theme = s.theme || "dark"; }
      }
    }
  } catch (e) {}
}

function build() {
  flat = [];
  state.lists.forEach(function (l, li) {
    l.items.forEach(function (q, qi) {
      flat.push({ li: li, qi: qi, q: q });
    });
  });
  if (state.pos >= flat.length) state.pos = 0;
  if (state.pos < 0) state.pos = 0;
}

/* ---------- отрисовка ---------- */
var stage = document.getElementById("stage");
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render() {
  if (!flat.length) {
    stage.innerHTML = '<p class="question">Нет вопросов</p><p class="hint">Откройте «Настройки» и загрузите .txt файлы.</p>';
    return;
  }
  if (state.pos >= flat.length) { renderFinish(); return; }
  var it = flat[state.pos];
  var list = state.lists[it.li];
  var param = state.disk[state.pos % state.disk.length];
  var leadText = (list.leads && typeof list.leads[it.qi] === "string") ? list.leads[it.qi] : (list.lead || "");
  var showLead = it.qi === 0 || true;
  stage.innerHTML =
    (leadText ? '<p class="lead">' + esc(leadText) + '</p>' : '') +
    '<h1 class="question">' + esc(it.q) + '</h1>' +
    '<div class="param"><small>добавьте</small><span>' + esc(param) + '</span></div>' +
    '<p class="category">Категория: <b>' + esc(list.name) + '</b></p>';
  document.getElementById("counter").innerHTML = '<span>' + (it.qi + 1) + ' из ' + list.items.length + '</span> &nbsp;(Всего ' + (state.pos + 1) + ' из ' + flat.length + ')';
  document.getElementById("bar").style.width = ((state.pos + 1) / flat.length * 100) + "%";
  document.getElementById("btnBack").style.visibility = state.pos === 0 ? "hidden" : "visible";
  document.getElementById("btnNext").textContent = "Далее";
  stage.scrollTop = 0;
}

function renderFinish() {
  stage.innerHTML =
    '<div class="finish"><h1 class="question">Круг пройден</h1>' +
    '<p class="lead">Вы прошли все ' + flat.length + ' вопросов.</p></div>';
  document.getElementById("counter").textContent = flat.length + " из " + flat.length;
  document.getElementById("bar").style.width = "100%";
  document.getElementById("btnNext").textContent = "Заново";
  document.getElementById("btnBack").style.visibility = "visible";
}

function next() {
  if (!flat.length) return;
  if (state.pos >= flat.length) { state.pos = 0; }
  else { state.pos++; }
  save(); render();
}
function back() {
  if (!flat.length) return;
  if (state.pos > 0) { state.pos--; save(); render(); }
}
document.getElementById("btnNext").addEventListener("click", next);
document.getElementById("btnBack").addEventListener("click", back);
document.addEventListener("keydown", function (e) {
  if (document.querySelector(".sheet.open")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
});

/* ---------- панели ---------- */
function openSheet(id) { document.getElementById(id).classList.add("open"); }
function closeSheets() { document.querySelectorAll(".sheet").forEach(function (s) { s.classList.remove("open"); }); }
document.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeSheets); });

function renderMenu() {
  var ul = document.getElementById("catList");
  ul.innerHTML = "";
  var start = 0;
  state.lists.forEach(function (l, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    var here = state.pos >= start && state.pos < start + l.items.length;
    if (here) b.className = "cur";
    b.innerHTML = '<div>' + esc(l.name) + '</div><span>' + l.items.length + ' вопр.</span>';
    (function (s) {
      b.addEventListener("click", function () { state.pos = s; save(); closeSheets(); render(); });
    })(start);
    li.appendChild(b); ul.appendChild(li);
    start += l.items.length;
  });
}
document.getElementById("btnMenu").addEventListener("click", function () { renderMenu(); openSheet("menuSheet"); });

function updateInfo() {
  document.getElementById("info").textContent =
    "Загружено категорий: " + state.lists.length + ", вопросов: " + flat.length + ", параметров ДИСК: " + state.disk.length + ".";
}
document.getElementById("btnSettings").addEventListener("click", function () { updateInfo(); openSheet("setSheet"); });

document.getElementById("btnBuiltin").addEventListener("click", function () {
  state.lists = DEFAULT_LISTS; state.disk = DEFAULT_DISK; state.src = "builtin"; state.pos = 0;
  save(); build(); closeSheets(); render();
});
document.getElementById("btnRestart").addEventListener("click", function () {
  state.pos = 0; save(); closeSheets(); render();
});

/* тема */
function applyTheme() {
  var r = document.documentElement;
  if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  document.getElementById("btnTheme").textContent = "Тема: " + ({auto:"авто", light:"светлая", dark:"тёмная"})[state.theme];
}
document.getElementById("btnTheme").addEventListener("click", function () {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  applyTheme(); save();
});

/* ---------- загрузка файлов ---------- */
function decode(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder("windows-1251").decode(buf); }
}
function cleanLines(text) {
  return text.replace(/^\uFEFF/, "").split(/\r?\n/).map(function (s) {
    s = s.trim();
    s = s.replace(/^0(?=[A-Za-zА-Яа-яЁё])/, ""); // лишний «0» перед буквой
    return s;
  }).filter(function (s) { return s.length; });
}
function readFile(f) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res({ name: f.name, text: decode(r.result) }); };
    r.onerror = function () { rej(r.error); };
    r.readAsArrayBuffer(f);
  });
}
function handleFiles(fileList) {
  var files = Array.prototype.slice.call(fileList).filter(function (f) { return /\.txt$/i.test(f.name); });
  var status = document.getElementById("loadStatus");
  if (!files.length) { status.textContent = "Не нашёл .txt файлов."; return; }
  Promise.all(files.map(readFile)).then(function (docs) {
    var lists = [], disk = null;
    docs.forEach(function (d) {
      var base = d.name.replace(/\.txt$/i, "");
      var lines = cleanLines(d.text);
      if (!lines.length) return;
      if (/^диск$/i.test(base.trim())) { disk = lines.map(function (x) { return x.charAt(0).toUpperCase() + x.slice(1); }); return; }
      var m = base.match(/^\s*(\d+)[\s._-]*(.*)$/);
      var order = m ? parseInt(m[1], 10) : 100000;
      var name = (m ? m[2] : base).trim() || base;
      var firstIsLead = /(:|^Создайте)\s*$/.test(lines[0]);
      var lead0 = firstIsLead ? (/:$/.test(lines[0]) ? lines[0] : lines[0] + ":") : "";
      var cur = lead0, items = [], leads = [];
      lines.slice(firstIsLead ? 1 : 0).forEach(function (l) {
        if (firstIsLead && /:$/.test(l)) { cur = l; return; }
        items.push(l); leads.push(cur);
      });
      if (name === name.toUpperCase()) name = name.toLowerCase();
      name = name.charAt(0).toUpperCase() + name.slice(1);
      var o = { order: order, name: name, lead: lead0, items: items };
      if (leads.some(function (x) { return x !== lead0; })) o.leads = leads;
      lists.push(o);
    });
    lists = lists.filter(function (l) { return l.items.length; });
    lists.sort(function (a, b) { return a.order - b.order || a.name.localeCompare(b.name, "ru"); });
    if (!lists.length && !disk) { status.textContent = "В файлах не нашлось подходящих строк."; return; }
    if (lists.length) state.lists = lists;
    if (disk) state.disk = disk;
    state.src = "custom";
    state.pos = 0;
    save(); build(); render(); updateInfo();
    status.textContent = "Готово: категорий — " + state.lists.length + ", вопросов — " + flat.length +
      (disk ? ", параметры ДИСК обновлены." : ". ДИСК.txt не выбран, оставлен прежний.");
  }).catch(function () { status.textContent = "Не удалось прочитать файлы."; });
}
var filePick = document.getElementById("filePick"), dirPick = document.getElementById("dirPick");
document.getElementById("btnPick").addEventListener("click", function () { filePick.click(); });
document.getElementById("btnPickDir").addEventListener("click", function () { dirPick.click(); });
filePick.addEventListener("change", function () { handleFiles(filePick.files); filePick.value = ""; });
dirPick.addEventListener("change", function () { handleFiles(dirPick.files); dirPick.value = ""; });

/* ---------- старт ---------- */
load(); build(); applyTheme(); render();
</script>
